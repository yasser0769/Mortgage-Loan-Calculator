<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حاسبة القروض العقارية</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
        /* Base styling */
        :root {
            --primary-color: #1c3f60;
            --accent-color: #2b8aeb;
            --background-color: #f2f4f8;
            --card-background: rgba(255, 255, 255, 0.95);
            --text-color: #1c1c1c;
            --error-color: #d9534f;
            --shadow-color: rgba(28, 63, 96, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8edf5 0%, #dce5f5 50%, #f7f9fb 100%);
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            color: var(--text-color);
            text-align: right;
            padding: 1.5rem;
        }

        .calculator-container {
            background: var(--card-background);
            border-radius: 20px;
            box-shadow: 0 20px 40px var(--shadow-color);
            padding: 2.5rem 2rem;
            max-width: 540px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 2.2vw, 2.4rem);
            color: var(--primary-color);
            font-weight: 700;
        }

        p.subtitle {
            margin: 0;
            font-size: clamp(1rem, 1.2vw, 1.1rem);
            color: #4a4a4a;
            line-height: 1.6;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            color: var(--primary-color);
        }

        input[type="number"] {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid #d6dce6;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(43, 138, 235, 0.15);
        }

        button {
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 0.95rem 1.2rem;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
        }

        button:hover {
            background: #1f78d5;
            box-shadow: 0 10px 25px rgba(43, 138, 235, 0.3);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 6px 18px rgba(43, 138, 235, 0.3);
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.95rem;
            min-height: 1.2rem;
        }

        .results-card {
            background: #f9fbff;
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid #e1e7f0;
            display: none;
            flex-direction: column;
            gap: 0.75rem;
        }

        .results-card h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .results-card p {
            margin: 0;
            font-size: 1.05rem;
            color: #333333;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .calculator-container {
                padding: 2rem 1.5rem;
                border-radius: 16px;
            }

            button {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <main class="calculator-container">
        <header>
            <h1>حاسبة القروض العقارية</h1>
            <p class="subtitle">أدخل قيمة التمويل العقاري، نسبة الفائدة، ومدة القرض، وسنحسب لك التفاصيل فوراً.</p>
        </header>

        <form id="loan-form">
            <label>
                مبلغ التمويل العقاري (بالريال)
                <input type="number" id="loan-amount" placeholder="مثال: 750000" min="0" step="0.01" />
            </label>
            <label>
                نسبة الفائدة السنوية ٪
                <input type="number" id="interest-rate" placeholder="مثال: 4.5" min="0" step="0.01" />
            </label>
            <label>
                مدة القرض (بالسنوات)
                <input type="number" id="loan-years" placeholder="مثال: 25" min="0" step="1" />
            </label>
            <button type="submit">احسب القرض</button>
            <div class="error-message" id="error-message"></div>
        </form>

        <section class="results-card" id="results-card">
            <h2>النتائج</h2>
            <p id="monthly-payment">القسط الشهري: -</p>
            <p id="total-with-interest">إجمالي المبلغ مع الفائدة: -</p>
            <p id="total-interest">إجمالي الفائدة المدفوعة: -</p>
        </section>
    </main>

    <script>
        // Retrieve form elements
        const loanForm = document.getElementById('loan-form');
        const loanAmountInput = document.getElementById('loan-amount');
        const interestRateInput = document.getElementById('interest-rate');
        const loanYearsInput = document.getElementById('loan-years');
        const errorMessageEl = document.getElementById('error-message');
        const resultsCard = document.getElementById('results-card');
        const monthlyPaymentEl = document.getElementById('monthly-payment');
        const totalWithInterestEl = document.getElementById('total-with-interest');
        const totalInterestEl = document.getElementById('total-interest');

        // Listen for form submission to perform calculations
        loanForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const principal = parseFloat(loanAmountInput.value);
            const annualRate = parseFloat(interestRateInput.value) / 100;
            const years = parseFloat(loanYearsInput.value);

            // Validate inputs to ensure all are provided and valid numbers
            if (
                !isFinite(principal) || principal <= 0 ||
                !isFinite(annualRate) || annualRate < 0 ||
                !isFinite(years) || years <= 0
            ) {
                errorMessageEl.textContent = 'يرجى إدخال جميع البيانات بشكل صحيح.';
                resultsCard.style.display = 'none';
                return;
            }

            // Calculate monthly rate and number of payments
            const monthlyRate = annualRate / 12;
            const months = years * 12;

            // Handle zero interest rate case to avoid division by zero
            let monthlyPayment;
            if (monthlyRate === 0) {
                monthlyPayment = principal / months;
            } else {
                monthlyPayment = principal * monthlyRate * Math.pow(1 + monthlyRate, months) /
                    (Math.pow(1 + monthlyRate, months) - 1);
            }

            const totalWithInterest = monthlyPayment * months;
            const totalInterest = totalWithInterest - principal;

            const formatter = new Intl.NumberFormat('ar-SA', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            monthlyPaymentEl.textContent = `القسط الشهري: ${formatter.format(monthlyPayment)}`;
            totalWithInterestEl.textContent = `إجمالي المبلغ مع الفائدة: ${formatter.format(totalWithInterest)}`;
            totalInterestEl.textContent = `إجمالي الفائدة المدفوعة: ${formatter.format(totalInterest)}`;

            errorMessageEl.textContent = '';
            resultsCard.style.display = 'flex';
        });
    </script>
</body>
</html>
